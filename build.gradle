plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
    // Trinkets' TrinketComponent extends Cardinal Components' ComponentV3.
    maven {
        name = 'Ladysnake'
        url = 'https://maven.ladysnake.org/releases'
    }
    // GeckoLib: models and animations authored in Blockbench.
    exclusiveContent {
        forRepository {
            maven {
                name = 'GeckoLib'
                url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
            }
        }
        filter { includeGroup 'software.bernie.geckolib' }
    }
    mavenCentral()
}

sourceSets {
    // Automated mechanic checks; never packaged into the release jar.
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

loom {
    accessWidenerPath = file('src/main/resources/apogee.accesswidener')

    mods {
        apogee {
            sourceSet sourceSets.main
        }
        apogee_gametest {
            sourceSet sourceSets.gametest
        }
    }

    runs {
        client {
            runDir 'run/client'
        }
        server {
            runDir 'run/server'
        }
        gametest {
            server()
            name 'Apogee GameTests'
            source sourceSets.gametest
            runDir 'build/gametest'
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${file('build/gametest/report.xml')}"
        }
        smokeClient {
            client()
            name 'Apogee client smoke run'
            source sourceSets.gametest
            runDir 'build/smoke-client'
            vmArg '-Dapogee.smoke=true'
        }
        mantisSmoke {
            client()
            name 'Apogee Mantis Blades smoke run'
            source sourceSets.gametest
            runDir 'build/mantis-smoke'
            vmArg '-Dapogee.mantisSmoke=true'
            programArgs '--width', '1600', '--height', '900'
        }
        nanowireSmoke {
            client()
            name 'Apogee Nanowire smoke run'
            source sourceSets.gametest
            runDir 'build/nanowire-smoke'
            vmArg '-Dapogee.nanowireSmoke=true'
            programArgs '--width', '1280', '--height', '720'
        }
        bloodPumpSmoke {
            client()
            name 'Apogee Blood Pump smoke run'
            source sourceSets.gametest
            runDir 'build/bloodpump-smoke'
            vmArg '-Dapogee.bloodPumpSmoke=true'
            programArgs '--width', '1280', '--height', '720'
        }
        ripperdocSmoke {
            client()
            name 'Apogee ripperdoc table smoke run'
            source sourceSets.gametest
            runDir 'build/ripperdoc-smoke'
            vmArg '-Dapogee.ripperdocSmoke=true'
            programArgs '--width', '1280', '--height', '720'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    modImplementation "maven.modrinth:trinkets:${trinkets_version}"
    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-base:${cca_version}"
    modRuntimeOnly "org.ladysnake.cardinal-components-api:cardinal-components-entity:${cca_version}"

    // Required dependency, installed separately by every player and server (not bundled).
    modImplementation "software.bernie.geckolib:geckolib-fabric-${minecraft_version}:${geckolib_version}"

    // Client tooltip stack. Simply Tooltips is compiled against but never bundled.
    modImplementation "maven.modrinth:simply-tooltips:${simply_tooltips_version}"
    modRuntimeOnly "maven.modrinth:architectury-api:${architectury_version}"
    modRuntimeOnly "maven.modrinth:fzzy-config:${fzzy_config_version}"
    // Fabric's own maven publishes the Kotlin stdlib as transitive dependencies for dev runs.
    modRuntimeOnly "net.fabricmc:fabric-language-kotlin:${fabric_kotlin_version}"
    // Fzzy Config's jar-in-jar libraries are not unpacked on the dev classpath.
    runtimeOnly 'blue.endless:jankson:1.2.3'
    runtimeOnly 'net.peanuuutz.tomlkt:tomlkt-jvm:0.3.7'
    modRuntimeOnly 'me.lucko:fabric-permissions-api:0.3.1'
    // Dev-only: exercises the optional Steampunk Leggings dash compatibility.
    modLocalRuntime "maven.modrinth:immersive-armors:${immersive_armors_version}"
    // Dev-only, with -PirisTest: shader pack checks (tools/mantis_tests.sh iris), where Sodium
    // and Iris are taken from here and run in a production-like instance.
    if (project.hasProperty('irisTest')) {
        modLocalRuntime 'maven.modrinth:sodium:mc1.21.1-0.8.13-fabric'
        modLocalRuntime 'maven.modrinth:iris:1.8.14-beta.1+1.21.1-fabric'
    }
}

processResources {
    def props = [version: project.version]
    inputs.properties props
    filesMatching('fabric.mod.json') {
        expand props
    }

    // Spanish-speaking locales share one translation file.
    from('src/main/resources/assets/apogee/lang/es_es.json') {
        into 'assets/apogee/lang'
        rename { 'es_cl.json' }
    }
    from('src/main/resources/assets/apogee/lang/es_es.json') {
        into 'assets/apogee/lang'
        rename { 'es_mx.json' }
    }
    from('src/main/resources/assets/apogee/lang/es_es.json') {
        into 'assets/apogee/lang'
        rename { 'es_ar.json' }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from('LICENSE_ASSETS.md')
}

// Dev-only: the Mantis client smoke script as an intermediary-mapped mod, for runs in a
// production-like instance (tools/mantis_tests.sh prod-iris), where mods such as Iris only work.
tasks.register('smokeJar', Jar) {
    from(sourceSets.gametest.output) {
        include 'dev/apogee/gametest/MantisClientSmoke*.class'
    }
    from('src/gametest/smoke-jar')
    archiveClassifier = 'smoke-dev'
    destinationDirectory = layout.buildDirectory.dir('smoke')
}
tasks.register('remapSmokeJar', net.fabricmc.loom.task.RemapJarTask) {
    dependsOn 'smokeJar'
    inputFile = tasks.named('smokeJar').flatMap { it.archiveFile }
    archiveClassifier = 'smoke'
    destinationDirectory = layout.buildDirectory.dir('smoke')
    addNestedDependencies = false
}

// Classpath of the dev runs, for tools/mantis_tests.sh, which starts several clients and a
// server at once (Gradle runs one Minecraft at a time).
tasks.register('writeDevRuntimeClasspath') {
    dependsOn 'gametestClasses', 'configureLaunch', 'downloadAssets'
    def out = layout.buildDirectory.file('dev-runtime-classpath.txt')
    inputs.property('irisTest', project.hasProperty('irisTest'))
    outputs.file out
    doLast {
        out.get().asFile.text = sourceSets.gametest.runtimeClasspath.asPath
    }
}

// Procedural animation regressions; no game window and no test classes in the release jar.
tasks.register('nanowireMotionTest', JavaExec) {
    dependsOn 'gametestClasses'
    classpath = sourceSets.gametest.runtimeClasspath
    mainClass = 'dev.apogee.client.nanowire.NanowireMotionChecks'
}
tasks.named('check') {
    dependsOn 'nanowireMotionTest'
}
